[package]
name = "thescavenger"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Terminal-first AST dependency graph and session memory engine for AI coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dalot/scavenger"
readme = "README.md"
keywords = ["ast", "dependency-graph", "claude", "code-intelligence", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["benchmark/", "scripts/", "specs/", ".cx-spec/", "tests/fixtures/", ".rdalot/"]

[lib]
name = "scavenger"
path = "src/lib.rs"

[[bin]]
name = "scavenger"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "1.4", features = ["server", "transport-io"] }
schemars = "1"

# AST parsing
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-bash = "0.25"
# tree-sitter-kotlin 0.3.8 requires tree-sitter <0.23 — incompatible with our 0.25.
# No compatible version exists as of 2026-03-01. Kotlin is a known unsupported language.
# Re-evaluate when tree-sitter-kotlin releases a 0.4+ version.
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"

# Graph
petgraph = "0.8"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio-rusqlite = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# File watching
notify = "8"
notify-debouncer-full = "0.7"
ignore = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"

# Concurrency
parking_lot = "0.12"
rayon = "1.10"

# Text processing
heck = "0.5"
strsim = "0.11"
md5 = "0.8"
sha2 = "0.10"

# File locking
fs2 = "0.4"

# Terminal output
owo-colors = "4"
ratatui = "0.30"
crossterm = "0.29"
indicatif = "0.17"

# Logging / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
libc = "0.2.184"

# OpenTelemetry (behind feature flag)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

[features]
default = []
telemetry = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
serde_yaml = "0.9"

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bench]]
name = "relevance_bench"
path = "src/bench/relevance_bench.rs"
harness = false

[[bench]]
name = "accuracy_bench"
path = "src/bench/accuracy_bench.rs"
harness = false

[[bench]]
name = "performance_bench"
path = "src/bench/performance_bench.rs"
harness = false
