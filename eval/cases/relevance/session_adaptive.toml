# Session-Adaptive Compression Test Cases
# Test that tighter budgets still produce usable results

[[case]]
name = "adaptive-minimal-still-useful"
category = "g1_keyword"
query = "parse_config"
expected_symbols = ["parse_config"]
detail_level = "minimal"

[case.assert]
bm25_should_find = true
graph_should_find = true

[[case]]
name = "adaptive-standard-graceful"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main", "parse_config"]
detail_level = "standard"

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "adaptive-budget-512"
category = "g1_keyword"
query = "parse_config"
expected_symbols = ["parse_config"]
detail_level = "standard"
budget_override = 512

[case.assert]
bm25_should_find = true
graph_should_find = true

[[case]]
name = "adaptive-budget-1024"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main"]
detail_level = "standard"
budget_override = 1024

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "adaptive-never-empty"
category = "g1_keyword"
query = "parse_config"
expected_symbols = ["parse_config"]
detail_level = "standard"
budget_override = 256

[case.assert]
bm25_should_find = true
graph_should_find = true
