# G3 (Hidden Dependency) Test Cases
# These cases require 2+ hop traversal where neither keywords nor direct imports suffice
# Only graph traversal should find these

[[case]]
name = "g3-request-logging-full-chain"
category = "g3_hidden"
query = "all code responsible for request logging"
expected_symbols = ["handle_request", "process_request", "log_message"]
expected_files = ["src/http.rs", "src/middleware/logging.rs", "src/logger.rs"]
detail_level = "detailed"

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "g3-config-validation-dependencies"
