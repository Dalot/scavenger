# G2 (Structural/Import-Chain) Test Cases
# These cases require import chain tracing (1-2 hops)
# BM25 alone should fail because query doesn't contain symbol names

[[case]]
name = "g2-callers-of-parse_config"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main", "parse_config"]
expected_files = ["src/main.rs", "src/config.rs"]
detail_level = "standard"

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "g2-callees-from-main"
category = "g2_structural"
query = "what does main function call"
expected_symbols = ["parse_config", "validate_config"]
expected_files = ["src/main.rs", "src/config.rs"]
detail_level = "standard"

[case.assert]
bm25_should_find = false
graph_should_find = true

