# Budget-Level Test Cases
# Test at different DetailLevel settings and explicit token budgets

# Minimal detail level cases
[[case]]
name = "budget-minimal-g2-callers"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main"]
detail_level = "minimal"

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "budget-minimal-g1-keyword"
category = "g1_keyword"
query = "parse_input"
expected_symbols = ["parse_input"]
detail_level = "minimal"

[case.assert]
bm25_should_find = true
graph_should_find = true

# Standard detail level cases
[[case]]
name = "budget-standard-g2-callers"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main", "parse_config"]
detail_level = "standard"

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "budget-standard-g1-keyword"
category = "g1_keyword"
query = "DataProcessor"
expected_symbols = ["DataProcessor", "process"]
detail_level = "standard"

[case.assert]
bm25_should_find = true
graph_should_find = true

# Detailed detail level cases
[[case]]
name = "budget-detailed-g2-callers"
category = "g2_structural"
query = "what does main function call"
expected_symbols = ["parse_config", "validate_config", "HttpServer::new"]
detail_level = "detailed"

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "budget-detailed-g3-chain"
category = "g3_hidden"
query = "all code responsible for request logging"
expected_symbols = ["handle_request", "process_request", "log_message"]
detail_level = "detailed"

[case.assert]
bm25_should_find = false
graph_should_find = true

# Explicit budget override cases
[[case]]
name = "budget-explicit-1024"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main"]
detail_level = "standard"
budget_override = 1024

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "budget-explicit-2048"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main", "parse_config"]
detail_level = "standard"
budget_override = 2048

[case.assert]
bm25_should_find = false
graph_should_find = true

[[case]]
name = "budget-explicit-4096"
category = "g2_structural"
query = "who calls parse_config"
expected_symbols = ["main", "parse_config", "validate_config"]
detail_level = "standard"
budget_override = 4096

[case.assert]
bm25_should_find = false
graph_should_find = true
