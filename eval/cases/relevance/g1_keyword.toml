# G1 (Keyword-Findable) Test Cases
# These cases should be found by BM25 alone because queries contain exact symbol names

[[case]]
name = "g1-find-parse_config"
category = "g1_keyword"
query = "parse_config function"
expected_symbols = ["parse_config"]
expected_files = ["src/config.rs"]
detail_level = "standard"

[case.assert]
bm25_should_find = true
graph_should_find = true

